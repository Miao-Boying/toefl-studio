function qs(s,el){ return (el||document).querySelector(s); }
function qsa(s,el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtPct(n,d){ return d? Math.round(100*n/d)+'%' : '—'; }
function escapeHtml(s){ return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const esc = escapeHtml;
function roundHalf(n){ return Math.round(n*2)/2; }
function cecrlLabel(level){ if(level===null||level===undefined) return ''; const r=Math.max(1,Math.min(6,Math.round(level))); return '≈ '+CECRL_APPROX[r]; }

function defaultProgress(){
  return {
    reading:{history:[]},
    listening:{history:[]},
    speaking:{ listen_repeat:{attempts:[]}, interview:{attempts:[]} },
    writing:{ build_sentence:{history:[]}, write_email:{attempts:[]}, write_academic_discussion:{attempts:[]} }

/* Rien de ce qui vient du stockage n'atteint la page sans être reconstruit :
   seules les clés connues sont reprises, chaque valeur est retypée (nombre
   borné, date ISO, texte présent dans la banque), le reste est ignoré. */
function lireEntier(v, min, max){ const n = Number(v); return (Number.isFinite(n) && n>=min && n<=max) ? Math.round(n) : null; }
function lireNote(v){ const n = Number(v); return (Number.isFinite(n) && n>=1 && n<=6) ? roundHalf(n) : null; }
function lireDate(v){ return (typeof v==='string' && /^\d{4}-\d{2}-\d{2}T[\d:.]+Z$/.test(v)) ? v : null; }
function liste(v, max){ return Array.isArray(v) ? v.slice(-max) : []; }
function nettoyerSessions(v){
  return liste(v, 20).map(function(h){
    if (!h || typeof h!=='object') return null;
    const total = lireEntier(h.total, 1, 1000), score = lireEntier(h.score, 0, 1000), date = lireDate(h.date);
    if (total===null || score===null || score>total || date===null) return null;
    const parNiveau = {};
    LEVELS.forEach(function(l){
      const s = h.parNiveau && h.parNiveau[l];
      const t = s ? lireEntier(s.total, 0, 1000) : 0, c = s ? lireEntier(s.correct, 0, 1000) : 0;
      parNiveau[l] = (t===null || c===null || c>t) ? {correct:0,total:0} : {correct:c,total:t};
    });
    return { date:date, score:score, total:total, pct:Math.round(100*score/total), parNiveau:parNiveau };
  }).filter(Boolean);
}
function nettoyerEssais(v, champ, valeursPermises){
  return liste(v, 30).map(function(a){
    if (!a || typeof a!=='object') return null;
    const note = lireNote(a.note), date = lireDate(a.date);
    if (note===null || date===null) return null;
    const e = { date:date, note:note };
    if (valeursPermises.indexOf(a[champ])>=0) e[champ] = a[champ];
    return e;
  }).filter(Boolean);
}
function loadProgress(){
  const d = defaultProgress();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return d;
    const p = JSON.parse(raw);
    if (!p || typeof p!=='object') return d;
    const g = function(o, k){ return (o && typeof o==='object') ? o[k] : undefined; };
    const phrases = SPEAKING.taches.find(function(t){ return t.type==='listen_repeat'; }).items.map(function(i){ return i.phrase_en; });
    const sujetsIv = SPEAKING.taches.find(function(t){ return t.type==='interview'; }).sujets;
    const sujetsEm = WRITING.taches.find(function(t){ return t.type==='write_email'; }).sujets;
    const sujetsDi = WRITING.taches.find(function(t){ return t.type==='write_academic_discussion'; }).sujets;
    d.reading.history = nettoyerSessions(g(p.reading,'history'));
    d.listening.history = nettoyerSessions(g(p.listening,'history'));
    d.writing.build_sentence.history = nettoyerSessions(g(g(p.writing,'build_sentence'),'history'));
    d.speaking.listen_repeat.attempts = nettoyerEssais(g(g(p.speaking,'listen_repeat'),'attempts'), 'phrase', phrases);
    d.speaking.interview.attempts = nettoyerEssais(g(g(p.speaking,'interview'),'attempts'), 'sujet', sujetsIv);
    d.writing.write_email.attempts = nettoyerEssais(g(g(p.writing,'write_email'),'attempts'), 'sujet', sujetsEm);
    d.writing.write_academic_discussion.attempts = nettoyerEssais(g(g(p.writing,'write_academic_discussion'),'attempts'), 'sujet', sujetsDi);
  } catch(e) {}
  return d;
}
function saveProgress(p){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e) {}
}

/* ---------- Synthèse vocale (anglais) ---------- */
function speak(text, rate){
  try {
    if (!('speechSynthesis' in window)) { alert("La synthèse vocale n'est pas disponible dans ce navigateur."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.95;
    speechSynthesis.speak(u);
  } catch(e) {}
}

/* ---------- Niveau atteint (reading / listening / build a sentence) ---------- */
function niveauAtteint(history){
  if (!history || !history.length) return null;
  let bestNiveau = null, bestSession = null;
  history.forEach(function(h){
    let atteint = null;
    LEVELS.forEach(function(lvl){
      const stat = h.parNiveau && h.parNiveau[lvl];
      if (stat && stat.total>0 && stat.correct/stat.total >= 0.6) atteint = lvl;
    });
    if (atteint && (bestNiveau===null || atteint > bestNiveau)) { bestNiveau = atteint; bestSession = h; }
  });
  const displaySession = bestSession || history.reduce(function(a,b){ return b.pct>a.pct?b:a; }, history[0]);
  return { session: displaySession, niveau: bestNiveau };
}
function bestNote(attempts){
  if (!attempts || !attempts.length) return null;
  return Math.max.apply(null, attempts.map(function(a){ return a.note; }));
}
function levelBadge(level){
  if (level===null || level===undefined) return '<span class="stamp neutral">non évalué</span>';
  if (level>=4) return '<span class="stamp ok">niveau '+level+'/6 ('+cecrlLabel(level)+')</span>';
  if (level>=2.5) return '<span class="stamp warn">niveau '+level+'/6 ('+cecrlLabel(level)+')</span>';
  return '<span class="stamp no">niveau '+level+'/6 ('+cecrlLabel(level)+')</span>';
}

function speakingLevelInfo(){
  const lr = bestNote(PROGRESS.speaking.listen_repeat.attempts);
  const iv = bestNote(PROGRESS.speaking.interview.attempts);
  const vals = [lr, iv].filter(function(v){ return v!==null; });
  if (!vals.length) return null;
  return roundHalf(vals.reduce(function(a,b){return a+b;},0)/vals.length);
}
function writingLevelInfo(){
  const bs = niveauAtteint(PROGRESS.writing.build_sentence.history);
  const em = bestNote(PROGRESS.writing.write_email.attempts);
  const disc = bestNote(PROGRESS.writing.write_academic_discussion.attempts);
  const vals = [bs && bs.niveau, em, disc].filter(function(v){ return v!==null && v!==undefined; });
  if (!vals.length) return null;
  return roundHalf(vals.reduce(function(a,b){return a+b;},0)/vals.length);
}
function globalLevelInfo(){
  const r = niveauAtteint(PROGRESS.reading.history);
  const l = niveauAtteint(PROGRESS.listening.history);
  const s = speakingLevelInfo();
  const w = writingLevelInfo();
  const vals = [r&&r.niveau, l&&l.niveau, s, w].filter(function(v){ return v!==null && v!==undefined; });
  if (!vals.length) return null;
  return roundHalf(vals.reduce(function(a,b){return a+b;},0)/vals.length);
}

/* ---------- Moteur QCM commun (reading / listening / build a sentence) ---------- */
let qState = null;

function qcmPool(domain){
  if (domain==='reading') return READING.questions;
  if (domain==='listening') return LISTENING.questions;
  if (domain==='build_sentence') return WRITING.taches.find(function(t){ return t.type==='build_sentence'; }).items;
  return [];
}
function qcmTypes(domain){
  if (domain==='reading') return READING.types_officiels;
  if (domain==='listening') return LISTENING.types_officiels;
  return null;
}
function qcmHistoryRef(domain){
  if (domain==='reading') return PROGRESS.reading;
  if (domain==='listening') return PROGRESS.listening;
  if (domain==='build_sentence') return PROGRESS.writing.build_sentence;
}
function qcmLabel(domain){
  if (domain==='reading') return READING.epreuve;
  if (domain==='listening') return LISTENING.epreuve;
  if (domain==='build_sentence') return 'Build a Sentence';
}

function startQcmSession(domain, type, level, containerId){
  let pool = qcmPool(domain);
  pool = pool.filter(function(q){ return (type==='all' || q.type===type) && (level==='all' || q.niveau===level); });
  pool = shuffle(pool);
  const n = Math.min(15, pool.length);
  qState = { domain:domain, containerId:containerId||'view', order:pool.slice(0,n), index:0, score:0, answered:false, selected:null, parNiveau:{} };
  LEVELS.forEach(function(l){ qState.parNiveau[l] = {correct:0,total:0}; });
  renderQcmQuestion(domain, qState.containerId);
}

function renderQcmPicker(domain){
  const types = qcmTypes(domain);
  let html = '';
  if (types) {
    html += '<div class="filter-label">Format d\'item</div><div class="level-tags" id="typeTags">'+
      '<button class="level-tag active" data-type="all">Tous les formats</button>'+
      types.map(function(t){ return '<button class="level-tag" data-type="'+esc(t.code)+'">'+esc(t.nom)+'</button>'; }).join('')+
      '</div>';
  }
  html += '<div class="filter-label">Niveau</div><div class="level-tags" id="levelTags">'+
    '<button class="level-tag active" data-lvl="all">Tous niveaux (session mélangée)</button>'+
    LEVELS.map(function(l){ return '<button class="level-tag" data-lvl="'+l+'">Niveau '+l+' ('+CECRL_APPROX[l]+')</button>'; }).join('')+
    '</div>'+
    '<div class="btn-row"><button class="btn" id="btnStartQcm">Démarrer la session (15 questions max)</button></div>';
  return html;
}

function renderQcmQuestion(domain, containerId){
  containerId = containerId || 'view';
  const view = qs('#'+containerId);
  const titleTag = containerId==='view' ? 'h1' : 'h2';
  if (!qState || qState.domain!==domain) {
    const pool = qcmPool(domain);
    view.innerHTML = '<'+titleTag+'>'+esc(qcmLabel(domain))+'</'+titleTag+'>'+
      '<p class="lead">'+esc( domain==='reading' ? READING.description_format : domain==='listening' ? LISTENING.description_format : WRITING.taches.find(function(t){return t.type==='build_sentence';}).consigne )+'</p>'+
      renderQcmPicker(domain)+
      '<p class="disclaimer">La banque compte actuellement '+pool.length+' questions, réparties sur les 6 niveaux de l\'échelle 1-6.</p>';
    let selType = 'all', selLvl = 'all';
    qsa('[data-type]', view).forEach(function(b){
      b.addEventListener('click', function(){ selType = b.getAttribute('data-type'); qsa('[data-type]', view).forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); });
    });
    qsa('[data-lvl]', view).forEach(function(b){
      b.addEventListener('click', function(){ selLvl = b.getAttribute('data-lvl'); qsa('[data-lvl]', view).forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); });
    });
    qs('#btnStartQcm', view).addEventListener('click', function(){
      startQcmSession(domain, selType, selLvl==='all' ? 'all' : parseInt(selLvl,10), containerId);
    });
    return;
  }
  const q = qState.order[qState.index];
  let html = '<'+titleTag+'>'+esc(qcmLabel(domain))+'</'+titleTag+'>';
  html += '<div class="progress-line">Question '+(qState.index+1)+' / '+qState.order.length+' · score actuel '+qState.score+'/'+qState.index+'</div>';
  html += '<div class="question-box">';
  html += '<div class="question-meta"><span>Niveau '+esc(q.niveau)+' ('+esc(CECRL_APPROX[q.niveau])+')</span><span>'+esc(q.type)+'</span></div>';
  if (domain==='listening') {
    html += '<div class="listen-text">'+(qState.answered ? ('<b>Transcript:</b> '+escapeHtml(q.texte)) : "Cliquez sur « Écouter » pour entendre le texte en anglais. Vous pouvez le réécouter autant de fois que nécessaire.")+'</div>';
    html += '<div class="btn-row"><button class="btn secondary" id="btnListen">🔊 Écouter</button></div>';
  } else if (q.texte) {
    html += '<div class="listen-text en">'+escapeHtml(q.texte)+'</div>';
  }
  html += '<div class="question-text">'+escapeHtml(q.question)+'</div>';
  q.choix.forEach(function(c, i){
    let cls = 'choice-btn';
    if (qState.answered) {
      if (i===q.reponse) cls += ' correct';
      else if (i===qState.selected) cls += ' wrong';
    }
    html += '<button class="'+cls+'" data-i="'+i+'" '+(qState.answered?'disabled':'')+'>'+escapeHtml(c)+'</button>';
  });
  if (qState.answered) {
    html += '<div class="explication">'+escapeHtml(q.explication)+'</div>';
    html += '<div class="btn-row"><button class="btn" id="btnNext">'+(qState.index+1>=qState.order.length? 'Voir le résultat →' : 'Question suivante →')+'</button></div>';
  }
  html += '</div>';
  view.innerHTML = html;

  if (domain==='listening') {
    qs('#btnListen').addEventListener('click', function(){ speak(q.texte, 0.95); });
  }
  qsa('.choice-btn', view).forEach(function(b){
    b.addEventListener('click', function(){ answerQcm(domain, parseInt(b.getAttribute('data-i'),10)); });
  });
  if (qState.answered) qs('#btnNext').addEventListener('click', function(){ nextQcm(domain); });
}

function answerQcm(domain, i){
  if (qState.answered) return;
  qState.answered = true;
  qState.selected = i;
  const q = qState.order[qState.index];
  const correct = i === q.reponse;
  if (correct) qState.score++;
  const stat = qState.parNiveau[q.niveau];
  stat.total++;
  if (correct) stat.correct++;
  renderQcmQuestion(domain, qState.containerId);
}
function nextQcm(domain){
  qState.index++;
  if (qState.index >= qState.order.length) { finishQcm(domain); return; }
  qState.answered = false; qState.selected = null;
  renderQcmQuestion(domain, qState.containerId);
}
function finishQcm(domain){
  const containerId = qState.containerId || 'view';
  const total = qState.order.length;
  const score = qState.score;
  const parNiveau = qState.parNiveau;
  const session = { date:new Date().toISOString(), score:score, total:total, pct:Math.round(100*score/total), parNiveau:parNiveau };
  const ref = qcmHistoryRef(domain);
  ref.history = ref.history || [];
  ref.history.push(session);
  if (ref.history.length > 20) ref.history.shift();
  saveProgress(PROGRESS);

  const titleTag = containerId==='view' ? 'h1' : 'h2';
  let html = '<'+titleTag+'>Résultat — '+esc(qcmLabel(domain))+'</'+titleTag+'>';
  html += '<div class="banner">Score : <b>'+score+' / '+total+'</b> ('+fmtPct(score,total)+')</div>';
  html += '<h3>Détail par niveau</h3>';
  html += '<table class="grille-table"><tr><th>Niveau</th><th>Bonnes réponses</th><th>Taux</th></tr>';
  LEVELS.forEach(function(l){
    const s = parNiveau[l];
    if (s.total) html += '<tr><td>'+l+' ('+CECRL_APPROX[l]+')</td><td>'+s.correct+'/'+s.total+'</td><td>'+fmtPct(s.correct,s.total)+'</td></tr>';
  });
  html += '</table>';
  html += '<p class="disclaimer">Ces exercices ne suivent pas l\'algorithme réel de notation de l\'ETS, qui n\'est pas publié dans le détail. Pour progresser, visez d\'abord la réussite régulière des niveaux 4 et 5. Consultez la page « Échelle de notation » pour plus de détails.</p>';
  const backLabel = domain==='build_sentence' ? "Retour à l'exercice Writing" : 'Retour au tableau de bord';
  html += '<div class="btn-row"><button class="btn" id="btnRetry">Nouvelle session</button><button class="btn secondary" id="btnDash">'+backLabel+'</button></div>';
  qState = null;
  qs('#'+containerId).innerHTML = html;
  qs('#btnRetry').addEventListener('click', function(){ renderQcmQuestion(domain, containerId); });
  qs('#btnDash').addEventListener('click', function(){ if (domain==='build_sentence') renderWriting(); else goTo('dashboard'); });
}

function renderReading(){ if (qState && qState.domain!=='reading') qState=null; renderQcmQuestion('reading'); }
function renderListening(){ if (qState && qState.domain!=='listening') qState=null; renderQcmQuestion('listening'); }

/* ---------- Grille d'auto-évaluation commune (1 à 6, par demi-point) ---------- */
function renderEvalGrid(storeKey, grille, afterSaveLabel){
  let html = '<h2>Auto-évaluation</h2>';
  html += '<p class="lead">Évaluez-vous honnêtement sur chaque critère, de 1 (débutant) à 6 (quasi natif). La moyenne, arrondie au demi-point, donne votre niveau estimé pour cet exercice — comme le calcul officiel ETS depuis 2026.</p>';
  grille.forEach(function(crit, idx){
    html += '<div class="slider-row" data-crit="'+idx+'">';
    html += '<div class="crit-name">'+esc(crit.critere)+' — <span class="val" id="val-'+storeKey+'-'+idx+'">3</span>/6</div>';
    html += '<input type="range" min="1" max="6" value="3" id="slider-'+storeKey+'-'+idx+'">';
    html += '<div class="crit-desc" id="desc-'+storeKey+'-'+idx+'">'+esc(crit.bareme[2].descripteur)+'</div>';
    html += '</div>';
  });
  html += '<div class="note-total" id="noteTotal-'+storeKey+'">Niveau estimé : 3/6</div>';
  html += '<div class="btn-row"><button class="btn" id="btnSaveEval-'+storeKey+'">'+(afterSaveLabel||'Enregistrer ce résultat')+'</button></div>';
  return html;
}
function bindEvalGrid(storeKey, grille, onSave){
  function recompute(){
    let total = 0;
    grille.forEach(function(crit, idx){
      const slider = qs('#slider-'+storeKey+'-'+idx);
      if (!slider) return;
      const v = parseInt(slider.value, 10);
      total += v;
      qs('#val-'+storeKey+'-'+idx).textContent = v;
      qs('#desc-'+storeKey+'-'+idx).textContent = crit.bareme[v-1].descripteur;
    });
    const avg = roundHalf(total/grille.length);
    const el = qs('#noteTotal-'+storeKey);
    if (el) el.textContent = 'Niveau estimé : '+avg+'/6 ('+cecrlLabel(avg)+')';
    return avg;
  }
  grille.forEach(function(crit, idx){
    const slider = qs('#slider-'+storeKey+'-'+idx);
    if (slider) slider.addEventListener('input', recompute);
  });
  recompute();
  const btn = qs('#btnSaveEval-'+storeKey);
  if (btn) btn.addEventListener('click', function(){ onSave(recompute()); });
}

/* ---------- Speaking ---------- */
let spTab = 1;

let ivState = { sujet:null, mode:'idle', prepSeconds:0, speakSeconds:0, timerHandle:null, stream:null, recorder:null, chunks:[], audioUrl:null, eval:false };

function lrReset(){ if (lrState.stream) lrState.stream.getTracks().forEach(function(t){t.stop();}); lrState = { phrase:null, stream:null, recorder:null, chunks:[], audioUrl:null, eval:false }; }
function ivReset(){ if (ivState.timerHandle) clearInterval(ivState.timerHandle); if (ivState.stream) ivState.stream.getTracks().forEach(function(t){t.stop();}); ivState = { sujet:null, mode:'idle', prepSeconds:0, speakSeconds:0, timerHandle:null, stream:null, recorder:null, chunks:[], audioUrl:null, eval:false }; }

function renderSpeaking(){

function renderListenRepeat(tache){

function bindListenRepeat(tache){

  });

    if (PROGRESS.speaking.listen_repeat.attempts.length > 30) PROGRESS.speaking.listen_repeat.attempts.pop();
    saveProgress(PROGRESS);
    lrReset();
    renderSpeaking();
  });
}

function fmtMMSS(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

function renderInterview(tache){
  let html = '<p>'+esc(tache.consigne)+'</p>';
  html += '<p class="lead">Temps de parole visé : '+esc(tache.duree_parole)+' · préparation : '+Math.round(tache.preparation_minutes*60)+' secondes</p>';
  html += '<div class="btn-row"><button class="btn secondary" id="btnTirerIV">Tirer une question au hasard</button></div>';
  if (ivState.sujet) {
    html += '<div class="sujet-box en">'+escapeHtml(ivState.sujet)+'</div>';
    html += '<div id="ivTimerZone"></div>';
    html += '<div class="audio-box" id="ivAudioZone"></div>';
    html += '<div class="btn-row"><button class="btn" id="btnIvEval">Terminer et m\'auto-évaluer</button></div>';
    if (ivState.eval) html += renderEvalGrid('iv', SPEAKING.grille, 'Enregistrer ce résultat');
  }
  return html;
}
function bindInterview(tache){
  qs('#btnTirerIV').addEventListener('click', function(){
    ivReset();
    ivState.sujet = tache.sujets[Math.floor(Math.random()*tache.sujets.length)];
    renderSpeaking();
  });
  if (!ivState.sujet) return;
  renderIvTimer(tache);
  renderMicZone(ivState, 'ivAudioZone');
  qs('#btnIvEval').addEventListener('click', function(){ if (ivState.timerHandle) clearInterval(ivState.timerHandle); ivState.eval = true; renderSpeaking(); });
  if (ivState.eval) bindEvalGrid('iv', SPEAKING.grille, function(note){
    PROGRESS.speaking.interview.attempts.unshift({ date:new Date().toISOString(), sujet:ivState.sujet, note:note });
    if (PROGRESS.speaking.interview.attempts.length > 30) PROGRESS.speaking.interview.attempts.pop();
    saveProgress(PROGRESS);
    ivReset();
    renderSpeaking();
  });
}
function renderIvTimer(tache){
  const zone = qs('#ivTimerZone');
  if (!zone) return;
  if (ivState.mode==='idle') { ivState.mode='prep'; ivState.prepSeconds = Math.round(tache.preparation_minutes*60); }
  function draw(){
    const z = qs('#ivTimerZone');
    if (!z) return;
    if (ivState.mode==='prep') {
      z.innerHTML = '<div class="timer-label">Préparation</div><div class="timer">'+fmtMMSS(ivState.prepSeconds)+'</div><div class="btn-row"><button class="btn rec" id="btnIvSpeak">🎙 Commencer à parler</button></div>';
      qs('#btnIvSpeak').addEventListener('click', function(){ if (ivState.timerHandle) clearInterval(ivState.timerHandle); startIvSpeaking(); });
    } else if (ivState.mode==='speaking') {
      z.innerHTML = '<div class="timer-label rec-live"><span class="dot"></span>Temps de parole écoulé (cible : '+esc(tache.duree_parole)+')</div><div class="timer rec">'+fmtMMSS(ivState.speakSeconds)+'</div>';
    }
  }
  if (ivState.mode==='prep') {
    ivState.timerHandle = setInterval(function(){
      ivState.prepSeconds--;
      if (ivState.prepSeconds<=0) { clearInterval(ivState.timerHandle); ivState.prepSeconds=0; }
      draw();
    }, 1000);
  }
  draw();
}
function startIvSpeaking(){
  ivState.mode='speaking'; ivState.speakSeconds=0;
  const z = qs('#ivTimerZone');
  function draw(){ const zz=qs('#ivTimerZone'); if(!zz) return; zz.innerHTML = '<div class="timer-label rec-live"><span class="dot"></span>Temps de parole écoulé</div><div class="timer rec">'+fmtMMSS(ivState.speakSeconds)+'</div>'; }
  draw();
  ivState.timerHandle = setInterval(function(){ ivState.speakSeconds++; draw(); }, 1000);
}

/* ---------- Micro commun (speaking) ---------- */
function renderMicZone(state, zoneId){
  const zone = qs('#'+zoneId);
  if (!zone) return;
  if (state.audioUrl) {
    zone.innerHTML = '<div class="audio-box"><audio controls src="'+state.audioUrl+'"></audio></div><div class="btn-row"><button class="btn secondary" id="btnMicRedo-'+zoneId+'">Recommencer l\'enregistrement</button></div>';
    qs('#btnMicRedo-'+zoneId).addEventListener('click', function(){ startMicRecording(state, zoneId); });
    return;
  }
  zone.innerHTML = '<div class="btn-row"><button class="btn secondary" id="btnMicStart-'+zoneId+'">🎙 Activer le micro pour m\'écouter</button></div>'+
    '<div class="mic-msg">Facultatif. L\'enregistrement reste uniquement dans votre navigateur, pour vous permettre de vous réécouter ; il n\'est ni envoyé ni conservé après la fermeture de la page.</div>';
  qs('#btnMicStart-'+zoneId).addEventListener('click', function(){ startMicRecording(state, zoneId); });
}
function startMicRecording(state, zoneId){
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    const z = qs('#'+zoneId);
    if (z) z.innerHTML += '<div class="mic-msg">Enregistrement audio non disponible dans ce navigateur. Vous pouvez poursuivre l\'exercice sans vous enregistrer.</div>';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    state.stream = stream;
    state.recorder = new MediaRecorder(stream);
    state.chunks = [];
    state.recorder.ondataavailable = function(e){ state.chunks.push(e.data); };
    state.recorder.onstop = function(){
      const blob = new Blob(state.chunks, {type:'audio/webm'});
      state.audioUrl = URL.createObjectURL(blob);
      renderMicZone(state, zoneId);
    };
    state.recorder.start();
    const z = qs('#'+zoneId);
    z.innerHTML = '<div class="btn-row"><button class="btn rec" id="btnMicStop-'+zoneId+'">⏹ Arrêter l\'enregistrement</button></div><div class="mic-msg rec-live"><span class="dot"></span>Enregistrement en cours…</div>';
    qs('#btnMicStop-'+zoneId).addEventListener('click', function(){ state.recorder.stop(); state.stream.getTracks().forEach(function(t){ t.stop(); }); });
  }).catch(function(){
    const z = qs('#'+zoneId);
    if (z) z.innerHTML += '<div class="mic-msg">Accès au micro refusé ou indisponible. Vous pouvez poursuivre l\'exercice sans vous enregistrer.</div>';
  });
}

/* ---------- Writing ---------- */
let wrTab = 1;
let eeState = { tacheType:null, sujet:null, mode:'idle', text:'', timerSeconds:0, timerHandle:null, eval:false };
function eeReset(){ if (eeState.timerHandle) clearInterval(eeState.timerHandle); eeState = { tacheType:eeState.tacheType, sujet:null, mode:'idle', text:'', timerSeconds:0, timerHandle:null, eval:false }; }

function renderWriting(){
  const bs = WRITING.taches.find(function(t){ return t.type==='build_sentence'; });
  const em = WRITING.taches.find(function(t){ return t.type==='write_email'; });
  const disc = WRITING.taches.find(function(t){ return t.type==='write_academic_discussion'; });
  const view = qs('#view');
  let html = '<h1>'+esc(WRITING.epreuve)+'</h1><p class="lead">'+esc(WRITING.description_format)+'</p>';
  html += '<div class="tache-tabs">'+
    '<button class="tache-tab'+(wrTab===1?' active':'')+'" data-t="1">Exercice 1 — '+esc(bs.nom)+'</button>'+
    '<button class="tache-tab'+(wrTab===2?' active':'')+'" data-t="2">Exercice 2 — '+esc(em.nom)+'</button>'+
    '<button class="tache-tab'+(wrTab===3?' active':'')+'" data-t="3">Exercice 3 — '+esc(disc.nom)+'</button>'+
    '</div>';
  if (wrTab===1) html += '<div id="wrBsZone"></div>';
  view.innerHTML = html;
  qsa('.tache-tab', view).forEach(function(b){
    b.addEventListener('click', function(){ wrTab = parseInt(b.getAttribute('data-t'),10); qState=null; eeReset(); renderWriting(); });
  });
  if (wrTab===1) { renderQcmQuestion('build_sentence', 'wrBsZone'); }
  else {
    const tache = wrTab===2 ? em : disc;
    const type = wrTab===2 ? 'write_email' : 'write_academic_discussion';
    renderFreeWriting(tache, type);
  }
}

function renderFreeWriting(tache, type){
  if (eeState.tacheType !== type) { eeReset(); eeState.tacheType = type; }
  const view = qs('#view');
  let html = '<p>'+esc(tache.consigne)+'</p>';
  html += '<p class="lead">Longueur visée : '+esc(tache.nb_mots_cible)+' · durée indicative : '+esc(tache.duree_minutes_cible)+' min</p>';
  html += '<div class="btn-row"><button class="btn secondary" id="btnTirerEe">Tirer un sujet au hasard</button></div>';
  if (eeState.sujet) {
    html += '<div class="sujet-box en">'+escapeHtml(eeState.sujet)+'</div>';
    if (!eeState.eval) {
      html += '<div id="eeTimerZone"></div>';
      html += '<textarea class="ee-text" id="eeText" placeholder="Write your response here…">'+escapeHtml(eeState.text)+'</textarea>';
      html += '<div class="wordcount neutral" id="eeWordcount">0 mot</div>';
      html += '<div class="btn-row"><button class="btn" id="btnEeTerminer">Terminer et m\'auto-évaluer</button></div>';
    } else {
      html += '<div class="listen-text en">'+escapeHtml(eeState.text)+'</div>';
      html += renderEvalGrid('ee-'+type, WRITING.grille, 'Enregistrer ce résultat');
    }
  }
  view.insertAdjacentHTML('beforeend', html);

  qs('#btnTirerEe').addEventListener('click', function(){
    eeReset();
    eeState.tacheType = type;
    eeState.sujet = tache.sujets[Math.floor(Math.random()*tache.sujets.length)];
    renderWriting();
  });
  if (eeState.sujet && !eeState.eval) {
    renderEeTimer(tache);
    const ta = qs('#eeText');
    updateWordcount();
    ta.addEventListener('input', function(){ eeState.text = ta.value; updateWordcount(); });
    qs('#btnEeTerminer').addEventListener('click', function(){
      if (eeState.timerHandle) clearInterval(eeState.timerHandle);
      eeState.text = ta.value; eeState.eval = true; renderWriting();
    });
  }
  if (eeState.eval) bindEvalGrid('ee-'+type, WRITING.grille, function(note){
    PROGRESS.writing[type].attempts.unshift({ date:new Date().toISOString(), sujet:eeState.sujet, note:note });
    if (PROGRESS.writing[type].attempts.length > 30) PROGRESS.writing[type].attempts.pop();
    saveProgress(PROGRESS);
    eeReset();
    renderWriting();
  });
}
function renderEeTimer(tache){
  const zone = qs('#eeTimerZone');
  if (!zone) return;
  if (!eeState.timerHandle && eeState.timerSeconds===0) { eeState.timerSeconds = tache.duree_minutes_cible*60; }
  function draw(){
    const z = qs('#eeTimerZone');
    if (!z) return;
    z.innerHTML = '<div class="timer-label">Temps restant indicatif</div><div class="timer'+(eeState.timerSeconds<=30?' rec':'')+'">'+fmtMMSS(eeState.timerSeconds)+'</div>';
  }
  if (!eeState.timerHandle) {
    eeState.timerHandle = setInterval(function(){
      eeState.timerSeconds--;
      if (eeState.timerSeconds<=0) { clearInterval(eeState.timerHandle); eeState.timerHandle=null; eeState.timerSeconds=0; }
      draw();
    }, 1000);
  }
  draw();
}
function updateWordcount(){
  const ta = qs('#eeText');
  const box = qs('#eeWordcount');
  if (!ta || !box) return;
  const words = ta.value.trim().split(/\s+/).filter(function(w){ return w.length>0; });
  const n = words.length;
  const target = eeState.tacheType==='write_email' ? EMAIL_TARGET : DISCUSSION_TARGET;
  let cls = 'neutral', msg = n+' mots';
  if (n < target[0]*0.8) { cls='warn'; msg += ' — encore court, cible '+target[0]+' à '+target[1]+' mots'; }
  else if (n <= target[1]*1.3) { cls='ok'; msg += ' — dans la zone visée ('+target[0]+' à '+target[1]+' mots)'; }
  else { msg += ' — au-delà de la cible ('+target[0]+' à '+target[1]+'), restez pertinent plutôt que long'; }
  box.className = 'wordcount '+cls;
  box.textContent = msg;
}

/* ---------- Démarrage ---------- */
/* Anti-détournement de clics : si un autre site affiche cette page dans un
   cadre invisible pour faire cliquer le lecteur (micro compris), l'application
   ne démarre pas. GitHub Pages ne permet pas d'interdire l'encadrement par
   en-tête HTTP, d'où ce contrôle côté page. */
let encadree = true;
try { encadree = window.top !== window.self; } catch(e) {}
if (encadree) {
  qs('#view').textContent = "Cette application doit être ouverte directement, pas à l'intérieur d'un autre site.";
} else {
  renderMenu();
  renderDashboard();
}
